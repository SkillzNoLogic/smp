<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked + Infuse Smp Leadboard</title>
    <style>
        :root {
            --bg-color: #05070c;
            --tile-bg: #0f131a;
            --tile-border: #1e2530;
            --stat-bg: #080a0f;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--tile-border);
            padding-bottom: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #refresh-timer {
            font-size: 0.825rem;
            color: var(--text-muted);
            background-color: var(--tile-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--tile-border);
            font-family: monospace;
        }

        #player-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Player Tile */
        .player-tile {
            background-color: var(--tile-bg);
            border: 1px solid var(--tile-border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-tile:hover {
            transform: translateY(-2px);
            border-color: #2a3649;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Header row inside tile */
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Liquid Glass Rank Style */
        .rank-badge {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Dynamic Rank Colors injected into liquid glass styling */
        .rank-badge.unranked { color: #94a3b8; text-shadow: 0 0 10px rgba(148, 163, 184, 0.5); }
        .rank-badge.bronze { color: #d97706; text-shadow: 0 0 10px rgba(217, 119, 6, 0.5); }
        .rank-badge.silver { color: #cbd5e1; text-shadow: 0 0 10px rgba(203, 213, 225, 0.5); }
        .rank-badge.gold { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .rank-badge.diamond { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }

        /* Expandable Stats Panel */
        .player-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-out;
            opacity: 0;
            border-top: 0px solid transparent;
            padding-top: 0;
        }

        .player-tile.expanded .player-details {
            max-height: 300px; 
            opacity: 1;
            border-top: 1px solid var(--tile-border);
            padding-top: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .stat-item {
            background-color: var(--stat-bg);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--tile-border);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.725rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            display: block;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-weight: 600;
            color: #ffffff;
        }

        .uuid-string {
            grid-column: span 2;
            font-family: monospace;
            font-size: 0.725rem;
            word-break: break-all;
            color: #475569;
        }

        .error-message {
            color: #f87171;
            text-align: center;
            padding: 1rem;
            background: rgba(248, 113, 113, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Leaderboard</h1>
            <div id="refresh-timer">Initializing...</div>
        </header>

        <main id="player-list">
            <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Loading live player telemetry...</div>
        </main>
    </div>

    <script>
        const API_URL = 'https://edmonton-types-omissions-switched.trycloudflare.com/players';
        let countdownInterval = null;
        let timeRemaining = 0;
        let expandedPlayers = new Set();

        async function fetchPlayerData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response failure');
                
                const data = await response.json();
                
                renderPlayers(data.players);
                startTimeCountdown(data.refresh_in);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('player-list').innerHTML = `
                    <div class="error-message">
                        Failed to load data. Retrying shortly...
                    </div>
                `;
                startTimeCountdown(10);
            }
        }

        function renderPlayers(players) {
            const container = document.getElementById('player-list');
            
            if (!players || players.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">No players active.</div>';
                return;
            }

            container.innerHTML = ''; 

            players.forEach(player => {
                const stats = player.stats || {};
                const rankClass = (stats.rank || 'unranked').toLowerCase();
                const isExpanded = expandedPlayers.has(player.uuid);

                const rawTime = parseFloat(stats['time played']) || 0;
                const formattedTime = (rawTime / 1200).toFixed(2);

                const tile = document.createElement('div');
                tile.className = `player-tile ${isExpanded ? 'expanded' : ''}`;
                tile.setAttribute('data-uuid', player.uuid);
                
                tile.innerHTML = `
                    <div class="player-header">
                        <span class="player-name">${player.name || 'Unknown'}</span>
                        <span class="rank-badge ${rankClass}">${stats.rank || 'UNRANKED'}</span>
                    </div>
                    <div class="player-details">
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span class="stat-label">Kills</span>
                                <span class="stat-value">${stats.kills ?? 0}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Deaths</span>
                                <span class="stat-value">${stats.deaths ?? 0}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Time Played Minutes</span>
                                <span class="stat-value">${formattedTime}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">K/D Ratio</span>
                                <span class="stat-value">${calculateKD(stats.kills, stats.deaths)}</span>
                            </div>
                            <div class="stat-item uuid-string">
                                <span class="stat-label">Player UUID</span>
                                <span>${player.uuid}</span>
                            </div>
                        </div>
                    </div>
                `;

                tile.addEventListener('click', () => {
                    tile.classList.toggle('expanded');
                    if (tile.classList.contains('expanded')) {
                        expandedPlayers.add(player.uuid);
                    } else {
                        expandedPlayers.delete(player.uuid);
                    }
                });

                container.appendChild(tile);
            });
        }

        function calculateKD(kills, deaths) {
            const k = parseFloat(kills) || 0;
            const d = parseFloat(deaths) || 0;
            if (d === 0) return k.toFixed(2);
            return (k / d).toFixed(2);
        }

        function startTimeCountdown(seconds) {
            clearInterval(countdownInterval);
            timeRemaining = Math.max(0, parseInt(seconds) || 10);
            updateTimerDisplay();

            countdownInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    fetchPlayerData(); 
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('refresh-timer');
            timerEl.textContent = `00:${timeRemaining.toString().padStart(2, '0')}`;
        }

        fetchPlayerData();
    </script>
</body>
</html>
