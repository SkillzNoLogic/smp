<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Stats Dashboard</title>
    <style>
        :root {
            --bg-color: #05070c;
            --tile-bg: #0f131a;
            --tile-border: #1e2530;
            --stat-bg: #080a0f;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--tile-border);
            padding-bottom: 1rem;
            gap: 1rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #refresh-timer {
            font-size: 0.825rem;
            color: var(--text-muted);
            background-color: var(--tile-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--tile-border);
            font-family: monospace;
        }

        .settings-btn {
            background: none;
            border: 1px solid var(--tile-border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            background-color: var(--tile-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, color 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .config-panel {
            display: none;
            background-color: var(--tile-bg);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.1);
        }

        .config-panel.show {
            display: block;
        }

        .config-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        .config-row {
            display: flex;
            gap: 0.5rem;
        }

        .config-input {
            flex: 1;
            background-color: var(--stat-bg);
            border: 1px solid var(--tile-border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: #ffffff;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .config-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .config-save-btn {
            background-color: var(--accent);
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .config-save-btn:hover {
            opacity: 0.9;
        }

        #player-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-tile {
            background-color: var(--tile-bg);
            border: 1px solid var(--tile-border);
            border-radius: 12px;
            padding: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-tile:hover {
            transform: translateY(-2px);
            border-color: #2a3649;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Pixel rendering setup for Minotar avatar */
        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: var(--stat-bg);
            border: 1px solid var(--tile-border);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .rank-badge {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .rank-badge.unranked { color: #94a3b8; text-shadow: 0 0 10px rgba(148, 163, 184, 0.5); }
        .rank-badge.bronze { color: #d97706; text-shadow: 0 0 10px rgba(217, 119, 6, 0.5); }
        .rank-badge.silver { color: #cbd5e1; text-shadow: 0 0 10px rgba(203, 213, 225, 0.5); }
        .rank-badge.gold { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .rank-badge.diamond { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }

        .player-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-out;
            opacity: 0;
            border-top: 0px solid transparent;
            padding-top: 0;
        }

        .player-tile.expanded .player-details {
            max-height: 500px; 
            opacity: 1;
            border-top: 1px solid var(--tile-border);
            padding-top: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .stat-item {
            background-color: var(--stat-bg);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--tile-border);
        }

        .stat-item.full-width {
            grid-column: span 2;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.725rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            display: block;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-weight: 600;
            color: #ffffff;
        }

        .error-message {
            color: #f87171;
            text-align: center;
            padding: 1rem;
            background: rgba(248, 113, 113, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Leaderboard</h1>
            <div class="header-controls">
                <div id="refresh-timer">00:00</div>
                <button class="settings-btn" id="toggle-config-btn" title="Change API URL">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <div class="config-panel" id="config-panel">
            <div class="config-title">Change Data Target Path</div>
            <div class="config-row">
                <input type="text" class="config-input" id="api-url-input" placeholder="Enter endpoint URL...">
                <button class="config-save-btn" id="save-config-btn">Update</button>
            </div>
        </div>

        <main id="player-list">
            <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Loading live player telemetry...</div>
        </main>
    </div>

    <script>
        const DEFAULT_API = 'https://edmonton-types-omissions-switched.trycloudflare.com/players';
        let activeApiUrl = localStorage.getItem('custom_api_url') || DEFAULT_API;

        let countdownInterval = null;
        let timeRemaining = 0;
        let expandedPlayers = new Set();

        const configPanel = document.getElementById('config-panel');
        const toggleConfigBtn = document.getElementById('toggle-config-btn');
        const apiUrlInput = document.getElementById('api-url-input');
        const saveConfigBtn = document.getElementById('save-config-btn');

        apiUrlInput.value = activeApiUrl;

        toggleConfigBtn.addEventListener('click', () => {
            configPanel.classList.toggle('show');
        });

        saveConfigBtn.addEventListener('click', () => {
            const newUrl = apiUrlInput.value.trim();
            if (newUrl) {
                activeApiUrl = newUrl;
                localStorage.setItem('custom_api_url', newUrl);
                configPanel.classList.remove('show');
                
                clearInterval(countdownInterval);
                document.getElementById('player-list').innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Connecting to new endpoint...</div>`;
                fetchPlayerData();
            }
        });

        function cleanString(str) {
            if (!str) return '';
            return str.replace(/<[^>]*>/g, '');
        }

        async function fetchPlayerData() {
            try {
                const response = await fetch(activeApiUrl);
                if (!response.ok) throw new Error('Network response failure');
                
                const data = await response.json();
                
                renderPlayers(data.players);
                startTimeCountdown(data.refresh_in);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('player-list').innerHTML = `
                    <div class="error-message">
                        Failed to load data from current endpoint.<br>
                        <span style="font-size:0.75rem; font-family:monospace; color:#ef4444">${activeApiUrl}</span>
                    </div>
                `;
                startTimeCountdown(5); 
            }
        }

        function renderPlayers(players) {
            const container = document.getElementById('player-list');
            if (!players || players.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">No players active.</div>';
                return;
            }
            container.innerHTML = ''; 

            players.forEach(player => {
                const stats = player.stats || {};
                const rankClass = (stats.rank || 'unranked').toLowerCase();
                const isExpanded = expandedPlayers.has(player.uuid);

                const rawTime = parseFloat(stats['time played']) || 0;
                const formattedTime = (rawTime / 1200).toFixed(2);

                // Minotar fallback path: Prefers UUID if valid, cleanly handles player name otherwise.
                // Uses the "helm" endpoint to include skin overlay layers (hair/hats).
                const identityToken = (player.uuid && player.uuid.length > 10) ? player.uuid.trim() : (player.name || 'MHF_Steve');
                const avatarUrl = `https://minotar.net/helm/${identityToken}/32.png`;

                let effectsHtml = '';
                Object.keys(stats).forEach(key => {
                    if (key.toLowerCase().startsWith('effect ')) {
                        effectsHtml += `
                            <div class="stat-item full-width">
                                <span class="stat-label">${key}</span>
                                <span class="stat-value">${cleanString(stats[key])}</span>
                            </div>
                        `;
                    }
                });

                const tile = document.createElement('div');
                tile.className = `player-tile ${isExpanded ? 'expanded' : ''}`;
                tile.setAttribute('data-uuid', player.uuid);
                
                tile.innerHTML = `
                    <div class="player-header">
                        <div class="player-profile">
                            <img src="${avatarUrl}" class="player-avatar" alt="${player.name || 'Player'}" onerror="this.onerror=null; this.src='https://minotar.net/helm/MHF_Steve/32.png';">
                            <span class="player-name">${player.name || 'Unknown'}</span>
                        </div>
                        <span class="rank-badge ${rankClass}">${stats.rank || 'UNRANKED'}</span>
                    </div>
                    <div class="player-details">
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span class="stat-label">Kills</span>
                                <span class="stat-value">${stats.kills ?? 0}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Deaths</span>
                                <span class="stat-value">${stats.deaths ?? 0}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Time Value</span>
                                <span class="stat-value">${formattedTime}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">K/D Ratio</span>
                                <span class="stat-value">${calculateKD(stats.kills, stats.deaths)}</span>
                            </div>
                            ${effectsHtml}
                        </div>
                    </div>
                `;

                tile.addEventListener('click', () => {
                    tile.classList.toggle('expanded');
                    if (tile.classList.contains('expanded')) {
                        expandedPlayers.add(player.uuid);
                    } else {
                        expandedPlayers.delete(player.uuid);
                    }
                });

                container.appendChild(tile);
            });
        }

        function calculateKD(kills, deaths) {
            const k = parseFloat(kills) || 0;
            const d = parseFloat(deaths) || 0;
            if (d === 0) return k.toFixed(2);
            return (k / d).toFixed(2);
        }

        function startTimeCountdown(seconds) {
            clearInterval(countdownInterval);
            timeRemaining = Math.max(0, parseInt(seconds) || 10);
            updateTimerDisplay();

            countdownInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    fetchPlayerData(); 
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('refresh-timer');
            timerEl.textContent = `00:${timeRemaining.toString().padStart(2, '0')}`;
        }

        fetchPlayerData();
    </script>
</body>
</html>
